<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/static/css/layout.css">

          <h1>Comfort-z</h1>

    <p>Comfort-z is an evidence-based behavioral monitoring agent built for the Google All Things Agentic Hackathon.</p>
    <p style="margin-top: 2px; font-size: 0.7rem; color: var(--color-text-muted);">
